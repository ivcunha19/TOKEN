<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOKEN — Sistema de Moeda Estudantil</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪙</text></svg>">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="app-header">
        <div class="container header-inner">
            <div class="brand">
                <span class="brand-badge" aria-hidden="true">🪙</span>
                <div>
                    <h1>TOKEN</h1>
                    <p class="subtitle">Sistema de Moeda Estudantil</p>
                </div>
            </div>
            <div id="user-area" class="user-area" hidden>
                <div class="user-info">
                    <strong id="user-nome"></strong>
                    <span id="user-tipo" class="user-tipo"></span>
                </div>
                <button type="button" id="btn-logout" class="nav-btn">Sair</button>
            </div>
        </div>
    </header>

    <main class="container main-content">
        <div id="status-banner" class="status-banner" role="status" aria-live="polite" hidden></div>
        <div id="app" aria-live="polite">
            <p class="loading">Carregando...</p>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
