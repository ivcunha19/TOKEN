# Perfil "prod": implantação na nuvem (Render). Ativado com SPRING_PROFILES_ACTIVE=prod.
# Sobrescreve apenas o que muda em relação ao application.properties.

# PostgreSQL gerenciado (Render PostgreSQL). As variáveis vêm do render.yaml (fromDatabase).
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

# Console do H2 não existe na nuvem
spring.h2.console.enabled=false

# O Render (e o proxy do Vercel) terminam o HTTPS e repassam os cabeçalhos X-Forwarded-*
server.forward-headers-strategy=framework

# Cookie de sessão só trafega em HTTPS
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}

# E-mail na nuvem: porta 2525 com STARTTLS (as portas 25/465/587 podem ser bloqueadas no plano gratuito)
spring.mail.port=${MAIL_PORT:2525}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
token.email.habilitado=${EMAIL_HABILITADO:false}
