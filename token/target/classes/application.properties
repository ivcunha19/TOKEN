spring.application.name=token
# Porta: o Render informa a porta pela variável PORT
server.port=${PORT:8080}

# Banco de Dados H2 (persistente em arquivo)
spring.datasource.url=jdbc:h2:file:./data/tokendb;DB_CLOSE_DELAY=-1;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate (ORM)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=${H2_WEB_ALLOW_OTHERS:false}

# Upload de fotos das vantagens
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Sessão HTTP (autenticação)
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# E-mail (SMTP). No Docker, aponta para o Mailpit (http://localhost:8025)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
# Credenciais SMTP: vazias no Mailpit; preenchidas na nuvem (Mailtrap, Brevo...)
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
token.email.habilitado=${EMAIL_HABILITADO:true}
token.email.remetente=${MAIL_FROM:nao-responda@token.edu.br}
